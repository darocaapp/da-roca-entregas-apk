
name: Gerar APK Da Roca Entregas

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar AndroidManifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          arquivo = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(arquivo)
              print("AndroidManifest.xml: XML valido!")
          except ET.ParseError as erro:
              print("ERRO NO ANDROIDMANIFEST:")
              print(erro)
              raise SystemExit(1)
          PY

      - name: Gerar APK
        run: gradle assembleDebug --stacktrace --info

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Da-Roca-Entregas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
