<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da Roça Entregas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3e7d3;
            color: #5b402d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            width: 85%;
            max-width: 420px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
        }

        h1 {
            margin-top: 0;
            color: #6b4f35;
        }

        .codigo {
            font-size: 30px;
            font-weight: bold;
            margin: 25px 0;
        }

        button {
            width: 100%;
            padding: 17px;
            border: 0;
            border-radius: 12px;
            background: #6b4f35;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #aviso {
            margin-top: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Da Roça Entregas</h1>

    <p>Confirmação de entrega iFood</p>

    <div class="codigo" id="codigo">--------</div>

    <button onclick="abrirApp()">
        Abrir confirmação
    </button>

    <div id="aviso">
        Abrindo aplicativo Da Roça...
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    let codigo = params.get("codigo") || "";

    codigo = codigo.replace(/\D/g, "");

    document.getElementById("codigo").textContent =
        codigo || "Código não informado";

    function abrirApp() {

        if (!codigo) {
            document.getElementById("aviso").textContent =
                "Código do pedido não informado.";
            return;
        }

        window.location.href =
            "daroca://ifood/" + codigo;
    }

    if (codigo) {
        setTimeout(abrirApp, 500);
    }
</script>

</body>
</html>
