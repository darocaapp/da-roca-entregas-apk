
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>DAROÇA Entregas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4eadc;
    color: #493322;
}

header {
    background: #5a3824;
    color: white;
    text-align: center;
    padding: 24px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    color: #ead7c2;
}

main {
    max-width: 480px;
    margin: auto;
    padding: 22px;
}

.card {
    background: #fffaf3;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 4px 14px #00000015;
    text-align: center;
}

h2 {
    margin-top: 0;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.ifood {
    background: #e92d39;
    color: white;
}

.food99 {
    background: #f6cb27;
    color: #272727;
}

.principal {
    background: #587342;
    color: white;
}

.secundario {
    background: #e9d8c5;
    color: #493322;
}

video {
    display: block;
    width: 100%;
    background: #222;
    border-radius: 12px;
    margin: 16px 0;
}

input {
    width: 100%;
    font-size: 26px;
    padding: 13px;
    text-align: center;
    letter-spacing: 3px;
    border: 2px solid #c8aa8a;
    border-radius: 12px;
}

#mensagem {
    margin-top: 16px;
    font-weight: bold;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.oculto {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>DAROÇA</h1>
    <p>Entregas • Leitor de localizador</p>
</header>

<main>
    <section id="inicio" class="card">
        <h2>Escolha a plataforma</h2>
        <p>Vamos identificar o localizador pela câmera.</p>

        <button class="ifood"
                onclick="iniciar('ifood')">
            LER iFood
        </button>

        <button class="food99"
                onclick="iniciar('99')">
            LER 99Food
        </button>
    </section>

    <section id="leitor" class="card oculto">
        <h2 id="tituloLeitor">Ler localizador</h2>

        <video id="camera"
               autoplay
               playsinline
               muted></video>

        <button id="botaoIdentificar"
                class="principal"
                onclick="identificar()">
            IDENTIFICAR LOCALIZADOR
        </button>

        <p id="mensagem" role="status"></p>

        <h3>Código identificado</h3>

        <input id="codigo"
               type="text"
               inputmode="numeric"
               maxlength="8"
               placeholder="8 números"
               autocomplete="off">

        <button class="principal"
                onclick="confirmarCodigo()">
            CONFIRMAR CÓDIGO
        </button>

        <button class="secundario"
                onclick="voltarInicio()">
            VOLTAR
        </button>
    </section>
</main>

<canvas id="foto" class="oculto"></canvas>

<script>
let plataforma = "";
let transmissao = null;
let processando = false;

const camera = document.getElementById("camera");
const mensagem = document.getElementById("mensagem");
const codigo = document.getElementById("codigo");
const botao = document.getElementById("botaoIdentificar");

function mostrarMensagem(texto) {
    mensagem.textContent = texto;
}

async function iniciar(tipo) {
    plataforma = tipo;
    codigo.value = "";
    mostrarMensagem("");

    document.getElementById("inicio")
        .classList.add("oculto");

    document.getElementById("leitor")
        .classList.remove("oculto");

    document.getElementById("tituloLeitor")
        .textContent =
        tipo === "ifood"
        ? "Localizador iFood"
        : "Localizador 99Food";

    try {
        transmissao =
            await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                }
            });

        camera.srcObject = transmissao;
        await camera.play();

        mostrarMensagem(
            "Câmera pronta! Aponte para o localizador."
        );

    } catch (erro) {
        mostrarMensagem(
            "Não foi possível abrir a câmera: " +
            erro.message
        );
    }
}

function identificar() {
    if (processando) {
        return;
    }

    if (!camera.videoWidth ||
        !camera.videoHeight) {
        mostrarMensagem(
            "A câmera ainda não está pronta."
        );
        return;
    }

    if (!window.DaRocaAndroid ||
        typeof window.DaRocaAndroid.reconhecerImagem
            !== "function") {
        mostrarMensagem(
            "Reconhecimento Android indisponível. " +
            "Verifique se instalou o APK atualizado."
        );
        return;
    }

    processando = true;
    botao.disabled = true;
    botao.textContent = "LENDO LOCALIZADOR...";

    mostrarMensagem(
        "Analisando a imagem. Aguarde..."
    );

    try {
        const canvas =
            document.getElementById("foto");

        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;

        const contexto = canvas.getContext("2d");

        contexto.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const imagem =
            canvas.toDataURL("image/jpeg", 0.9);

        window.DaRocaAndroid.reconhecerImagem(imagem);

    } catch (erro) {
        finalizarLeitura();

        mostrarMensagem(
            "Erro ao capturar a imagem: " +
            erro.message
        );
    }
}

function finalizarLeitura() {
    processando = false;
    botao.disabled = false;
    botao.textContent = "IDENTIFICAR LOCALIZADOR";
}

window.receberResultadoOCR = function(
    numero,
    erro
) {
    finalizarLeitura();

    if (erro) {
        mostrarMensagem(erro);
        return;
    }

    const somenteNumeros =
        String(numero || "").replace(/\D/g, "");

    if (somenteNumeros.length === 8) {
        codigo.value = somenteNumeros;

        mostrarMensagem(
            "Localizador identificado: " +
            somenteNumeros
        );

    } else {
        mostrarMensagem(
            "Não encontrei os 8 números. " +
            "Tente novamente ou digite manualmente."
        );
    }
};

function confirmarCodigo() {
    const numero =
        codigo.value.replace(/\D/g, "");

    if (numero.length !== 8) {
        mostrarMensagem(
            "Digite ou identifique os 8 números."
        );
        return;
    }

    mostrarMensagem(
        "Código " + numero +
        " identificado para " +
        (plataforma === "ifood"
            ? "iFood"
            : "99Food") +
        ". Próxima etapa: abrir a confirmação."
    );
}

function pararCamera() {
    if (transmissao) {
        transmissao.getTracks().forEach(
            faixa => faixa.stop()
        );

        transmissao = null;
    }

    camera.srcObject = null;
}

function voltarInicio() {
    pararCamera();
    finalizarLeitura();

    plataforma = "";
    codigo.value = "";
    mostrarMensagem("");

    document.getElementById("leitor")
        .classList.add("oculto");

    document.getElementById("inicio")
        .classList.remove("oculto");
}
</script>

</body>
</html>
